<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#2a2260"/>
      <stop offset="55%" stop-color="#141830"/>
      <stop offset="100%" stop-color="#07080f"/>
    </radialGradient>

    <linearGradient id="rift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a1eb0"/>
      <stop offset="45%" stop-color="#3a1080"/>
      <stop offset="100%" stop-color="#0b0418"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b06ef0"/>
      <stop offset="50%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#b06ef0"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="45%" stop-color="#57e8ff"/>
      <stop offset="100%" stop-color="#57e8ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c98f1e"/>
      <stop offset="100%" stop-color="#ffe89a"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <clipPath id="squircle">
      <path d="M512 40
               C 742 40 850 40 918 108
               C 984 174 984 282 984 512
               C 984 742 984 850 918 918
               C 850 984 742 984 512 984
               C 282 984 174 984 108 918
               C 40 850 40 742 40 512
               C 40 282 40 174 108 108
               C 174 40 282 40 512 40 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- ambient purple bloom -->
    <ellipse cx="512" cy="470" rx="330" ry="300" fill="#6a3fd0" opacity="0.45" filter="url(#softglow)"/>

    <!-- the abyss rift: a tall lens shape -->
    <path d="M512 150
             C 700 300 790 420 790 512
             C 790 604 700 724 512 874
             C 324 724 234 604 234 512
             C 234 420 324 300 512 150 Z"
          fill="url(#rift)"/>

    <!-- gold rim hugging the rift -->
    <path d="M512 150
             C 700 300 790 420 790 512
             C 790 604 700 724 512 874
             C 324 724 234 604 234 512
             C 234 420 324 300 512 150 Z"
          fill="none" stroke="url(#rim)" stroke-width="26" stroke-linejoin="round"/>

    <!-- cyan core -->
    <ellipse cx="512" cy="512" rx="150" ry="196" fill="url(#core)" filter="url(#glow)"/>

    <!-- crown spikes -->
    <g filter="url(#glow)">
      <path d="M512 96 L 560 300 L 512 268 L 464 300 Z" fill="url(#gold)"/>
      <path d="M300 196 L 372 372 L 322 348 L 272 386 Z" fill="url(#gold)" opacity="0.92"/>
      <path d="M724 196 L 752 386 L 702 348 L 652 372 Z" fill="url(#gold)" opacity="0.92"/>
    </g>

    <!-- horizontal abyss slash -->
    <rect x="150" y="494" width="724" height="36" rx="18"
          fill="#0a0c12" opacity="0.92"/>
    <rect x="150" y="494" width="724" height="36" rx="18"
          fill="none" stroke="url(#rim)" stroke-width="7" opacity="0.9"/>
  </g>
</svg>
